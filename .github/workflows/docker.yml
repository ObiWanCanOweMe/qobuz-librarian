name: Docker

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit is reachable from main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Published release tag commit must be reachable from origin/main." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "import('./scripts/release/qobuz-tag.mjs').then(({ parseQobuzTag }) => parseQobuzTag(process.env.RELEASE_TAG))"

      - name: Build CSS assets and run deployment contracts
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:deployment-contract

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check src tests

      - name: Image smoke test (builds the image, boots it, checks routes + bundled tools)
        run: bash scripts/smoke_test.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cross-build the arm64 image
        run: docker buildx build --platform linux/arm64 .

  tag-preflight:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the exact release tag is absent
        env:
          IMAGE_REF: ghcr.io/obiwancanoweme/qobuz-librarian:${{ github.event.release.tag_name }}
        run: |
          INSPECT_OUTPUT=""
          if INSPECT_OUTPUT="$(docker buildx imagetools inspect "$IMAGE_REF" 2>&1)"; then
            echo "Image tag already exists: $IMAGE_REF" >&2
            exit 1
          fi

          if printf '%s\n' "$INSPECT_OUTPUT" | grep -Eqi 'manifest unknown|manifest.*not found|not found.*manifest|: not found$'; then
            echo "Image tag is absent: $IMAGE_REF"
            exit 0
          fi

          echo "Unable to prove image tag is absent: $IMAGE_REF" >&2
          printf '%s\n' "$INSPECT_OUTPUT" >&2
          exit 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: [verify, tag-preflight]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/obiwancanoweme/qobuz-librarian:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Record immutable image digest
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '- Image: `ghcr.io/obiwancanoweme/qobuz-librarian`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tag: `${{ github.event.release.tag_name }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Digest: `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

  scan-image:
    needs: [verify, tag-preflight, build-and-push]
    uses: ./.github/workflows/scan-images.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      packages: read
      security-events: write

  deploy-production:
    needs: [verify, tag-preflight, build-and-push, scan-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    concurrency:
      group: qobuz-librarian-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy immutable release through Portainer
        run: node scripts/deploy/portainer-release.mjs
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          QOBUZ_LIBRARIAN_VERSION: ${{ github.event.release.tag_name }}
          QOBUZ_HEALTH_URL: ${{ vars.QOBUZ_HEALTH_URL }}
