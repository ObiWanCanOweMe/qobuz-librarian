{# With upgrades unavailable the nav hides Upgrade and /upgrade bounces home,
   so the switcher goes too. #}
{% if upgrade_available %}
<nav class="ql-page-tabs ql-quality-tabs" aria-label="Quality tools">
  <a href="/upgrade"
     class="{% if active_tab == 'upgrade' %}is-active{% endif %}"
     {% if active_tab == 'upgrade' %}aria-current="page"{% endif %}><span>Upgrade</span></a>
  <a href="/downsample"
     class="{% if active_tab == 'downsample' %}is-active{% endif %}"
     {% if active_tab == 'downsample' %}aria-current="page"{% endif %}><span>Downsample</span></a>
</nav>
{% endif %}
