{% extends "base.html" %}
{% block title %}Service paused — Qobuz Librarian{% endblock %}
{% block content %}

<div class="ql-list-page ql-system-page">
<div class="ql-system-card">
<header class="ql-page-header">
  <h1>Service paused</h1>
  <p>Another run is using the library right now. Try again when that work is finished.</p>
</header>

<div class="ql-notice ql-notice-error ql-system-notice">
  <svg class="ql-system-notice-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01M5 19h14a2 2 0 0 0 1.84-2.75L13.74 4a2 2 0 0 0-3.5 0L3.18 16.25A2 2 0 0 0 5 19z"/>
  </svg>
  <span>{{ msg }}</span>
</div>

<div class="ql-system-actions">
  <button type="button" data-reload class="ql-btn ql-btn-primary w-full sm:w-auto">Try again</button>
  <a href="/" class="ql-btn ql-btn-ghost w-full sm:w-auto">Back to Search</a>
</div>
</div>
</div>

{% endblock %}
